<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#6366f1" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="#0f172a"/>
  <!-- Microphone & Sound Waves -->
  <g filter="url(#glow)">
    <!-- Mic Capsule -->
    <rect x="26" y="14" width="12" height="20" rx="6" fill="url(#grad)"/>
    <!-- Mic Mesh Line -->
    <line x1="26" y1="23" x2="38" y2="23" stroke="#c7d2fe" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Mic Stand Arc -->
    <path d="M20 24 C20 35, 44 35, 44 24" fill="none" stroke="url(#grad)" stroke-width="3" stroke-linecap="round"/>
    <!-- Mic Stand Stem -->
    <line x1="32" y1="35" x2="32" y2="45" stroke="url(#grad)" stroke-width="3" stroke-linecap="round"/>
    <!-- Mic Base Foot -->
    <line x1="24" y1="45" x2="40" y2="45" stroke="url(#grad)" stroke-width="3" stroke-linecap="round"/>
    <!-- Audio Wave Accents -->
    <path d="M13 26 C11 28, 11 32, 13 34" fill="none" stroke="#a5b4fc" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M51 26 C53 28, 53 32, 51 34" fill="none" stroke="#a5b4fc" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
